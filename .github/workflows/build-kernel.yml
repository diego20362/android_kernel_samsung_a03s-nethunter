name: Build A03s Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Clone kernel
        run: |
          git clone --depth=1 --branch android-4.19-stable https://github.com/diego20362/android_kernel_samsung_a03s-nethunter.git kernel

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            gcc-aarch64-linux-gnu \
            make \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            pahole

      - name: Generate configuration
        working-directory: kernel
        run: |
          make ARCH=arm64 \
            CC=clang \
            HOSTCC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            a03s_defconfig

      - name: Verify RT5370 configuration
        working-directory: kernel
        run: |
          echo "===== RT5370 CONFIG ====="
          grep -E '^CONFIG_(WLAN_VENDOR_RALINK|RT2X00|RT2800_LIB|RT2800USB)' .config || true

      - name: Build kernel
        working-directory: kernel
        run: |
          set +e

          make -j2 \
            ARCH=arm64 \
            CC=clang \
            HOSTCC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS=-gdwarf-4 \
            Image.gz \
            modules 2>&1 | tee build.log

          BUILD_STATUS=${PIPESTATUS[0]}

          echo
          echo "===== ERROR EN MTK_TRACE ====="
          grep -n -B 15 -A 15 "mtk_trace.o" build.log || true

          echo
          echo "===== ERRORES DEL COMPILADOR ====="
          grep -n -E "error:|Error:|fatal error:" build.log | tail -30 || true

          echo
          echo "===== ÚLTIMAS 100 LÍNEAS ====="
          tail -n 100 build.log

          exit $BUILD_STATUS

      - name: Install modules
        if: success()
        working-directory: kernel
        run: |
          mkdir -p ../modules

          make -j2 \
            ARCH=arm64 \
            CC=clang \
            HOSTCC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            modules_install \
            INSTALL_MOD_PATH=../modules

      - name: Verify build outputs
        if: success()
        working-directory: kernel
        run: |
          echo "===== KERNEL ====="
          ls -lh arch/arm64/boot/Image.gz

          echo
          echo "===== RT2X00 MODULES ====="
          find drivers/net/wireless/ralink/rt2x00 \
            -type f \
            \( -name 'rt2800usb.ko' -o -name 'rt2800lib.ko' -o -name 'rt2x00*.ko' \) \
            -print

          echo
          echo "===== ALL MODULES ====="
          find ../modules -name '*.ko' | head -50

      - name: Package results
        if: success()
        run: |
          mkdir -p artifact

          cp kernel/arch/arm64/boot/Image.gz artifact/

          if [ -d modules ]; then
            tar -czf artifact/modules.tar.gz modules
          fi

          echo "===== ARTIFACTS ====="
          ls -lh artifact

      - name: Upload kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: a03s-kernel-build
          path: artifact/
