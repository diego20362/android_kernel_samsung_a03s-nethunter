- name: Fix MTK Ftrace include path
        working-directory: kernel
        run: |
          echo "===== MTK FTRACE ANTES ====="
          grep -n "TRACE_INCLUDE_PATH\|TRACE_INCLUDE_FILE" kernel/trace/mtk_ftrace.h || true

          sed -i 's/^#define TRACE_INCLUDE_PATH .*/#define TRACE_INCLUDE_PATH ./' kernel/trace/mtk_ftrace.h

          echo "===== MTK FTRACE DESPUÉS ====="
          grep -n "TRACE_INCLUDE_PATH\|TRACE_INCLUDE_FILE" kernel/trace/mtk_ftrace.h || true

          test -f kernel/trace/mtk_ftrace.h

      - name: Build kernel
        working-directory: kernel
        run: |
          set +e

          make -j1 \
            ARCH=arm64 \
            CC=clang \
            HOSTCC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-gdwarf-4 -Ikernel/trace" \
            Image.gz \
            modules 2>&1 | tee build.log

          BUILD_STATUS=${PIPESTATUS[0]}

          echo "===== ERRORES REALES ====="
          grep -n -E \
            "error:|fatal error:|undefined reference|Error 1|Error 2" \
            build.log | tail -50 || true

          echo "===== ÚLTIMAS 150 LÍNEAS ====="
          tail -n 150 build.log

          exit $BUILD_STATUS
