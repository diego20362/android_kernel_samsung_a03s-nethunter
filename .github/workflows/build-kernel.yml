      - name: Build kernel
        working-directory: kernel
        run: |
          set +e

          make -j1 \
            ARCH=arm64 \
            CC=clang \
            HOSTCC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS=-gdwarf-4 \
            Image.gz \
            modules 2>&1 | tee build.log

          BUILD_STATUS=${PIPESTATUS[0]}

          echo
          echo "========================================"
          echo "       ERRORES REALES DEL COMPILADOR"
          echo "========================================"

          grep -n -E \
            "error:|fatal error:|undefined reference|Error 1|Error 2" \
            build.log | tail -50 || true

          echo
          echo "========================================"
          echo "       ÚLTIMAS 150 LÍNEAS"
          echo "========================================"

          tail -n 150 build.log

          exit $BUILD_STATUS
