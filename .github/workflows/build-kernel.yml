name: Build A03s Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Clone kernel
        run: |
          git clone --depth=1 \
            --branch android-4.19-stable \
            https://github.com/diego20362/android_kernel_samsung_a03s-nethunter.git \
            kernel

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            gcc-aarch64-linux-gnu \
            make \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            pahole \
            xz-utils \
            cpio

          echo "===== TOOLS ====="
          command -v clang
          command -v cpio
          command -v xz
          command -v aarch64-linux-gnu-gcc

      - name: Generate configuration
        working-directory: kernel
        run: |
          make ARCH=arm64 \
            CC=clang \
            HOSTCC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            a03s_defconfig

      - name: Verify RT5370 configuration
        working-directory: kernel
        run: |
          echo "===== RALINK CONFIG ====="

          grep -E \
            '^CONFIG_(WLAN_VENDOR_RALINK|RT2X00|RT2800_LIB|RT2800USB)' \
            .config || true

          echo "===== RT5370 SUPPORT ====="

          grep -E \
            '^CONFIG_RT2800USB_RT53XX=' \
            .config || true

          grep -q '^CONFIG_WLAN_VENDOR_RALINK=y$' .config
          grep -q '^CONFIG_RT2800USB=m$' .config
          grep -q '^CONFIG_RT2800USB_RT53XX=y$' .config

      - name: Fix MTK Ftrace
        working-directory: kernel
        run: |
          set -e

          test -f kernel/trace/mtk_ftrace.h
          test -f kernel/trace/Makefile

          sed -i \
            's/^#define TRACE_INCLUDE_PATH .*/#define TRACE_INCLUDE_PATH ./' \
            kernel/trace/mtk_ftrace.h

          sed -i \
            '/^CFLAGS_mtk_trace\.o := -I$(src)$/d' \
            kernel/trace/Makefile

          printf '\nCFLAGS_mtk_trace.o := -I$(src)\n' \
            >> kernel/trace/Makefile

          echo "===== FTRACE CONFIGURATION ====="
          grep -n 'TRACE_INCLUDE_PATH' \
            kernel/trace/mtk_ftrace.h

          grep -n 'CFLAGS_mtk_trace' \
            kernel/trace/Makefile

      - name: Fix kheaders cpio path
        working-directory: kernel
        run: |
          set -e

          CPIO_PATH="$(command -v cpio)"

          test -x "$CPIO_PATH"

          echo "===== CPIO PATH ====="
          echo "$CPIO_PATH"

          echo "===== ORIGINAL SCRIPT ====="
          nl -ba kernel/gen_kheaders.sh | sed -n '55,68p'

          sed -i \
            "s#/tools/build/cpio#$CPIO_PATH#g" \
            kernel/gen_kheaders.sh

          echo "===== UPDATED SCRIPT ====="
          nl -ba kernel/gen_kheaders.sh | sed -n '55,68p'

          if grep -q '/tools/build/cpio' kernel/gen_kheaders.sh; then
            echo "ERROR: ruta antigua de cpio todavía presente"
            exit 1
          fi

      - name: Locate CTS configuration header
        working-directory: kernel
        run: |
          set -e

          echo "===== BUSCANDO cts_config.h ====="

          find drivers/input/touchscreen/mediatek \
            -type f \
            -name 'cts_config.h' \
            -print

          CTS_HEADER="$(find drivers/input/touchscreen/mediatek \
            -type f \
            -name 'cts_config.h' \
            -print -quit)"

          if [ -z "$CTS_HEADER" ]; then
            echo "ERROR: cts_config.h no existe en el árbol del kernel."
            echo "No se creará un archivo ficticio."
            echo "Hay que recuperar el archivo correcto del código fuente."
            exit 1
          fi

          CTS_DIR="$(dirname "$CTS_HEADER")"

          echo "Header encontrado: $CTS_HEADER"
          echo "Directorio de inclusión: $CTS_DIR"

          echo "CTS_CONFIG_INCLUDE=-I$CTS_DIR" >> "$GITHUB_ENV"

      - name: Diagnose trace and touchscreen headers
        working-directory: kernel
        run: |
          echo "===== TRACE MMSTAT ====="

          find . -type f \
            -name 'trace_mmstat.h' -print || true

          echo "===== MTK FTRACE ====="

          find . -type f \
            -name 'mtk_ftrace.h' -print || true

          echo "===== CTS HEADER ====="

          find drivers/input/touchscreen/mediatek \
            -type f \
            -name 'cts_config.h' \
            -print || true

          echo "===== CTS INCLUDE ====="

          grep -R -n '"cts_config.h"' \
            drivers/input/touchscreen/mediatek || true

      - name: Build kernel
        working-directory: kernel
        shell: bash
        run: |
          set -o pipefail

          echo "===== BUILD KERNEL ====="
          echo "CTS_CONFIG_INCLUDE=$CTS_CONFIG_INCLUDE"

          make -j1 \
            ARCH=arm64 \
            CC=clang \
            HOSTCC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-gdwarf-4 -Ikernel/trace $CTS_CONFIG_INCLUDE" \
            Image.gz \
            modules 2>&1 | tee build.log

      - name: Show build diagnostics
        if: always()
        working-directory: kernel
        run: |
          if [ -f build.log ]; then
            echo "===== ERRORES ====="

            grep -n -E \
              "error:|fatal error|undefined reference|Error 1|Error 2|Error 127" \
              build.log | tail -50 || true

            echo "===== FINAL DEL REGISTRO ====="
            tail -n 100 build.log
          fi

      - name: Install modules
        if: success()
        working-directory: kernel
        run: |
          mkdir -p ../modules

          make -j2 \
            ARCH=arm64 \
            CC=clang \
            HOSTCC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            modules_install \
            INSTALL_MOD_PATH=../modules

      - name: Verify build outputs
        if: success()
        working-directory: kernel
        run: |
          set -e

          echo "===== KERNEL ====="
          test -s arch/arm64/boot/Image.gz
          ls -lh arch/arm64/boot/Image.gz
          sha256sum arch/arm64/boot/Image.gz

          echo "===== RT2X00 DRIVER FILES ====="

          find drivers/net/wireless/ralink/rt2x00 \
            -type f \
            \( \
              -name 'rt2800usb.ko' \
              -o -name 'rt2800lib.ko' \
              -o -name 'rt2x00*.ko' \
            \) \
            -print

          echo "===== INSTALLED RT2X00 MODULES ====="

          find ../modules \
            -type f \
            -name '*.ko' \
            | grep -E 'rt2800usb|rt2800lib|rt2x00' || true

      - name: Package results
        if: success()
        run: |
          set -e

          mkdir -p artifact

          cp kernel/arch/arm64/boot/Image.gz artifact/

          if [ -d modules ]; then
            tar -czf artifact/modules.tar.gz modules
          fi

          echo "===== ARTIFACTS ====="
          ls -lh artifact
          sha256sum artifact/*

      - name: Upload kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: a03s-kernel-build
          path: artifact/
