name: RT5370 Kconfig Dependency Check

on:
  workflow_dispatch:
  push:
    branches:
      - android-4.19-stable

jobs:
  check:
    runs-on: ubuntu-22.04

    steps:
      - name: Clone repository
        run: |
          git clone --depth=1 --branch android-4.19-stable \
            https://github.com/diego20362/android_kernel_samsung_a03s-nethunter.git kernel

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang gcc-aarch64-linux-gnu make bc bison flex libssl-dev libelf-dev

      - name: Generate config
        working-directory: kernel
        run: |
          make ARCH=arm64 \
            CC=clang \
            HOSTCC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            a03s_defconfig

      - name: Inspect Ralink conditions
        working-directory: kernel
        run: |
          echo "===== DEFCONFIG RALINK ====="
          grep -nE \
            "CONFIG_(WLAN_VENDOR_RALINK|RT2X00|RT2800USB|RT2800USB_RT53XX)" \
            arch/arm64/configs/a03s_defconfig || true

          echo
          echo "===== GENERATED CONFIG RALINK ====="
          grep -nE \
            "CONFIG_(WLAN_VENDOR_RALINK|RT2X00|RT2800USB|RT2800USB_RT53XX)" \
            .config || true

          echo
          echo "===== WIRELESS CONFIG ====="
          grep -nE \
            "CONFIG_(WIRELESS|WLAN|CFG80211|MAC80211)" \
            .config || true

          echo
          echo "===== RALINK KCONFIG ====="
          cat drivers/net/wireless/ralink/Kconfig

          echo
          echo "===== RT2X00 MENUCONFIG ====="
          sed -n '1,280p' drivers/net/wireless/ralink/rt2x00/Kconfig

          echo
          echo "===== CONFIGURE RT2X00 DIRECTLY ====="
          make ARCH=arm64 \
            CC=clang \
            HOSTCC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          echo
          echo "===== FINAL RT2X00 VALUES ====="
          grep -nE \
            "CONFIG_(WLAN_VENDOR_RALINK|RT2X00|RT2X00_LIB|RT2X00_LIB_USB|RT2800_LIB|RT2800USB|RT2800USB_RT53XX)" \
            .config || true
