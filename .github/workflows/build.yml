name: A03s NetHunter - Diagnostico Configuracion

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Generar .config A03s
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar codigo con Git
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "       DESCARGANDO KERNEL A03S"
          echo "========================================"

          git --version

          git clone \
            --depth=1 \
            --branch android-4.19-stable \
            --single-branch \
            https://github.com/diego20362/android_kernel_samsung_a03s-nethunter.git \
            kernel

          cd kernel

          echo ""
          echo "===== RAMA ====="
          git branch --show-current

          echo ""
          echo "===== COMMIT ====="
          git log -1 --format=%H

      - name: Instalar herramientas
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            llvm \
            lld \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            bc \
            bison \
            flex \
            build-essential \
            libssl-dev \
            libelf-dev \
            python3

      - name: Generar configuracion A03s
        shell: bash
        run: |
          set -e
          cd kernel

          echo "========================================"
          echo "       GENERANDO .config"
          echo "========================================"

          make \
            ARCH=arm64 \
            CC=clang \
            HOSTCC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            a03s_defconfig

          echo ""
          echo "===== COMPROBAR .config ====="

          if [ -f ".config" ]; then
            echo ".config: OK"
            ls -lh .config
          else
            echo ".config: NO GENERADO"
            exit 1
          fi

          echo ""
          echo "===== OPCIONES RT5370 EN .config ====="
          grep -nE \
            'CONFIG_(RT2X00|RT2800USB|RT2800USB_RT53XX|RT2X00_LIB_USB)' \
            .config || true

          echo ""
          echo "===== OPCIONES WIFI ====="
          grep -nE \
            'CONFIG_(CFG80211|MAC80211)' \
            .config || true

          echo ""
          echo "===== OPCIONES USB ====="
          grep -nE \
            '^CONFIG_USB_SUPPORT=|^CONFIG_USB=' \
            .config || true

      - name: Guardar .config y diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a03s-config-diagnostico
          path: |
            kernel/.config
            kernel/arch/arm64/configs/a03s_defconfig
            kernel/drivers/net/wireless/ralink/rt2x00/Kconfig
            kernel/drivers/net/wireless/ralink/rt2x00/Makefile
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
