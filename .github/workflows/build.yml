name: A03s NetHunter - Diagnostico RT5370

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    name: Investigar RT5370 en Kconfig
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar kernel
        shell: bash
        run: |
          set -e

          git clone \
            --depth=1 \
            --branch android-4.19-stable \
            --single-branch \
            https://github.com/diego20362/android_kernel_samsung_a03s-nethunter.git \
            kernel

          cd kernel

          echo "===== RAMA ====="
          git branch --show-current

          echo ""
          echo "===== COMMIT ====="
          git log -1 --format=%H

      - name: Instalar herramientas
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            llvm \
            lld \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            bc \
            bison \
            flex \
            build-essential \
            libssl-dev \
            libelf-dev \
            python3

      - name: Generar .config
        shell: bash
        run: |
          set -e
          cd kernel

          echo "========================================"
          echo "       GENERANDO .config"
          echo "========================================"

          make \
            ARCH=arm64 \
            CC=clang \
            HOSTCC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            a03s_defconfig

          echo ""
          echo "===== 1. DEFCONFIG ORIGINAL ====="

          grep -nE \
            'CONFIG_(RT2X00|RT2800USB|RT2800USB_RT53XX|RT2X00_LIB_USB)' \
            arch/arm64/configs/a03s_defconfig || true

          echo ""
          echo "===== 2. CONFIG GENERADO ====="

          grep -nE \
            'CONFIG_(RT2X00|RT2800USB|RT2800USB_RT53XX|RT2X00_LIB_USB)' \
            .config || true

          echo ""
          echo "===== 3. KCONFIG RT2X00 ====="

          grep -nE \
            'config RT2800USB|config RT2800USB_RT53XX|select RT2X00_LIB_USB|config RT2X00_LIB_USB' \
            drivers/net/wireless/ralink/rt2x00/Kconfig || true

          echo ""
          echo "===== 4. MAKEFILE RT2X00 ====="

          cat drivers/net/wireless/ralink/rt2x00/Makefile

          echo ""
          echo "===== 5. ARCHIVOS RT2800USB ====="

          ls -lh \
            drivers/net/wireless/ralink/rt2x00/rt2800usb.c \
            drivers/net/wireless/ralink/rt2x00/rt2800usb.h \
            drivers/net/wireless/ralink/rt2x00/Kconfig \
            drivers/net/wireless/ralink/rt2x00/Makefile

          echo ""
          echo "===== 6. OPCIONES USB/WIFI ====="

          grep -nE \
            '^CONFIG_(USB_SUPPORT|USB|CFG80211|MAC80211)=' \
            .config || true

          echo ""
          echo "===== 7. BUSCAR RT2800USB EN TODO EL KERNEL ====="

          grep -Rns \
            'RT2800USB_RT53XX' \
            drivers/net/wireless/ralink/rt2x00 \
            arch/arm64/configs \
            2>/dev/null || true

          echo ""
          echo "===== 8. BUSCAR RT2X00_LIB_USB ====="

          grep -Rns \
            'RT2X00_LIB_USB' \
            drivers/net/wireless/ralink/rt2x00 \
            2>/dev/null || true

      - name: Guardar diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a03s-diagnostico-rt5370
          path: |
            kernel/.config
            kernel/arch/arm64/configs/a03s_defconfig
            kernel/drivers/net/wireless/ralink/rt2x00/Kconfig
            kernel/drivers/net/wireless/ralink/rt2x00/Makefile
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
