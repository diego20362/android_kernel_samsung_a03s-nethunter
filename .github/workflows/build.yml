name: Find Ralink Dependency

on:
  workflow_dispatch:
  push:
    branches:
      - android-4.19-stable

jobs:
  check:
    runs-on: ubuntu-22.04

    steps:
      - name: Clone
        run: |
          git clone --depth=1 --branch android-4.19-stable https://github.com/diego20362/android_kernel_samsung_a03s-nethunter.git kernel

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang gcc-aarch64-linux-gnu make bc bison flex libssl-dev libelf-dev

      - name: Diagnose
        working-directory: kernel
        run: |
          make ARCH=arm64 CC=clang HOSTCC=clang CROSS_COMPILE=aarch64-linux-gnu- a03s_defconfig

          echo "===== SYMBOL IN SOURCE ====="
          grep -R -n "WLAN_VENDOR_RALINK" --include='Kconfig*' . | head -30

          echo
          echo "===== WIRELESS BLOCK ====="
          sed -n '1,180p' drivers/net/wireless/Kconfig

          echo
          echo "===== FINAL ====="
          grep -n "WLAN_VENDOR_RALINK" .config || true

          echo
          echo "===== RT2X00 CONFIG RESULTS ====="
          grep -E '^CONFIG_(RT2X00|RT2800_LIB|RT2800USB)' .config || true
