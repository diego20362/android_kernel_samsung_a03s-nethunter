name: A03s NetHunter - Diagnostico Kconfig RT5370

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    name: Investigar inclusion RT2X00
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar kernel
        shell: bash
        run: |
          set -e

          git clone \
            --depth=1 \
            --branch android-4.19-stable \
            --single-branch \
            https://github.com/diego20362/android_kernel_samsung_a03s-nethunter.git \
            kernel

          cd kernel

          echo "===== RAMA ====="
          git branch --show-current

          echo ""
          echo "===== COMMIT ====="
          git log -1 --format=%H

      - name: Instalar herramientas
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            clang \
            llvm \
            lld \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            bc \
            bison \
            flex \
            build-essential \
            libssl-dev \
            libelf-dev \
            python3

      - name: Buscar inclusion de RT2X00
        shell: bash
        run: |
          set -e

          cd kernel

          echo "========================================"
          echo "      CADENA DE INCLUSION KCONFIG"
          echo "========================================"

          echo ""
          echo "===== INCLUDE RT2X00 ====="

          grep -Rns \
            -E 'source.*rt2x00|source.*RT2X00' \
            drivers \
            arch \
            2>/dev/null || true

          echo ""
          echo "===== INCLUDE RALINK ====="

          grep -Rns \
            -E 'source.*ralink|source.*RALINK' \
            drivers/net \
            2>/dev/null || true

          echo ""
          echo "===== REFERENCIAS RT2X00/KCONFIG ====="

          grep -Rns \
            'rt2x00/Kconfig' \
            drivers \
            arch \
            2>/dev/null || true

      - name: Revisar Kconfig superiores
        shell: bash
        run: |
          set -e

          cd kernel

          echo "========================================"
          echo "        KCONFIG SUPERIORES"
          echo "========================================"

          echo ""
          echo "===== drivers/net/wireless/Kconfig ====="

          if [ -f drivers/net/wireless/Kconfig ]; then
            sed -n '1,240p' drivers/net/wireless/Kconfig
          else
            echo "NO EXISTE"
          fi

          echo ""
          echo "===== drivers/net/wireless/ralink/Kconfig ====="

          if [ -f drivers/net/wireless/ralink/Kconfig ]; then
            cat drivers/net/wireless/ralink/Kconfig
          else
            echo "NO EXISTE"
          fi

      - name: Revisar estructura Ralink
        shell: bash
        run: |
          set -e

          cd kernel

          echo "========================================"
          echo "          ESTRUCTURA RALINK"
          echo "========================================"

          if [ -d drivers/net/wireless/ralink ]; then
            find drivers/net/wireless/ralink \
              -maxdepth 2 \
              -type f \
              | sort
          else
            echo "DIRECTORIO RALINK NO EXISTE"
          fi

      - name: Revisar Kconfig RT2X00
        shell: bash
        run: |
          set -e

          cd kernel

          echo "========================================"
          echo "          KCONFIG RT2X00"
          echo "========================================"

          echo ""
          echo "===== RT2X00 ====="

          grep -n -A20 -B5 \
            'config RT2X00' \
            drivers/net/wireless/ralink/rt2x00/Kconfig || true

          echo ""
          echo "===== RT2800USB ====="

          grep -n -A20 -B5 \
            'config RT2800USB' \
            drivers/net/wireless/ralink/rt2x00/Kconfig || true

          echo ""
          echo "===== RT2800USB_RT53XX ====="

          grep -n -A15 -B5 \
            'config RT2800USB_RT53XX' \
            drivers/net/wireless/ralink/rt2x00/Kconfig || true

      - name: Generar configuracion A03s
        shell: bash
        run: |
          set -e

          cd kernel

          echo "========================================"
          echo "          GENERANDO .CONFIG"
          echo "========================================"

          make \
            ARCH=arm64 \
            CC=clang \
            HOSTCC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            a03s_defconfig

          echo ""
          echo "===== COMPROBAR .CONFIG ====="

          test -f .config

          ls -lh .config

      - name: Comparar RT5370
        shell: bash
        run: |
          set -e

          cd kernel

          echo "========================================"
          echo "          COMPARACION RT5370"
          echo "========================================"

          echo ""
          echo "===== DEFCONFIG ORIGINAL ====="

          grep -nE \
            'CONFIG_(RT2X00|RT2800USB|RT2800USB_RT53XX|RT2X00_LIB_USB)' \
            arch/arm64/configs/a03s_defconfig || true

          echo ""
          echo "===== CONFIG GENERADO ====="

          grep -nE \
            'CONFIG_(RT2X00|RT2800USB|RT2800USB_RT53XX|RT2X00_LIB_USB)' \
            .config || true

          echo ""
          echo "===== WLAN ====="

          grep -nE \
            '^CONFIG_(WIRELESS|WLAN|CFG80211|MAC80211)=' \
            .config || true

          echo ""
          echo "===== USB Y DMA ====="

          grep -nE \
            '^CONFIG_(USB_SUPPORT|USB|HAS_DMA)=' \
            .config || true

      - name: Buscar dependencias RT2X00
        shell: bash
        run: |
          set -e

          cd kernel

          echo "========================================"
          echo "        DEPENDENCIAS RT2X00"
          echo "========================================"

          grep -nE \
            'depends on|select ' \
            drivers/net/wireless/ralink/rt2x00/Kconfig \
            | head -100 || true

      - name: Guardar diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a03s-diagnostico-kconfig-rt5370
          path: |
            kernel/.config
            kernel/arch/arm64/configs/a03s_defconfig
            kernel/drivers/net/wireless/Kconfig
            kernel/drivers/net/wireless/ralink/Kconfig
            kernel/drivers/net/wireless/ralink/rt2x00/Kconfig
            kernel/drivers/net/wireless/ralink/rt2x00/Makefile
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
