name: A03s NetHunter - Diagnostico Inclusion RT5370

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    name: Investigar inclusion Kconfig RT2X00
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. DESCARGAR EL KERNEL
      # ============================================================
      - name: Descargar kernel
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "       DESCARGANDO KERNEL A03S"
          echo "========================================"

          git clone \
            --depth=1 \
            --branch android-4.19-stable \
            --single-branch \
            https://github.com/diego20362/android_kernel_samsung_a03s-nethunter.git \
            kernel

          cd kernel

          echo ""
          echo "===== RAMA ====="
          git branch --show-current

          echo ""
          echo "===== COMMIT ====="
          git log -1 --format=%H


      # ============================================================
      # 2. INSTALAR HERRAMIENTAS
      # ============================================================
      - name: Instalar herramientas
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            clang \
            llvm \
            lld \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            bc \
            bison \
            flex \
            build-essential \
            libssl-dev \
            libelf-dev \
            python3


      # ============================================================
      # 3. LOCALIZAR KCONFIG RT2X00
      # ============================================================
      - name: Localizar archivos Kconfig
        shell: bash
        run: |
          set -e

          cd kernel

          echo "========================================"
          echo "       ARCHIVOS KCONFIG"
          echo "========================================"

          echo ""
          echo "===== KCONFIG DEL DRIVER ====="

          find drivers/net/wireless/ralink \
            -name 'Kconfig*' \
            -type f \
            -print \
            | sort

          echo ""
          echo "===== RT2X00 ====="

          ls -lh \
            drivers/net/wireless/ralink/rt2x00/Kconfig \
            drivers/net/wireless/ralink/rt2x00/Makefile


      # ============================================================
      # 4. BUSCAR INCLUSIONES RT2X00
      # ============================================================
      - name: Buscar inclusion RT2X00
        shell: bash
        run: |
          set -e

          cd kernel

          echo "========================================"
          echo "       CADENA DE INCLUSION"
          echo "========================================"

          echo ""
          echo "===== INCLUDE RT2X00 ====="

          grep -Rns \
            'source.*rt2x00' \
            drivers \
            arch \
            2>/dev/null || true

          echo ""
          echo "===== INCLUDE RALINK ====="

          grep -Rns \
            'source.*ralink' \
            drivers/net \
            2>/dev/null || true

          echo ""
          echo "===== REFERENCIAS RT2X00 ====="

          grep -Rns \
            'rt2x00/Kconfig' \
            drivers \
            arch \
            2>/dev/null || true


      # ============================================================
      # 5. MOSTRAR KCONFIG SUPERIORES
      # ============================================================
      - name: Mostrar Kconfig superiores
        shell: bash
        run: |
          set -e

          cd kernel

          echo "========================================"
          echo "       KCONFIG SUPERIORES"
          echo "========================================"

          echo ""
          echo "===== drivers/net/wireless/Kconfig ====="

          if [ -f drivers/net/wireless/Kconfig ]; then
            cat drivers/net/wireless/Kconfig
          else
            echo "NO EXISTE"
          fi

          echo ""
          echo "===== drivers/net/wireless/ralink/Kconfig ====="

          if [ -f drivers/net/wireless/ralink/Kconfig ]; then
            cat drivers/net/wireless/ralink/Kconfig
          else
            echo "NO EXISTE"
          fi


      # ============================================================
      # 6. MOSTRAR ESTRUCTURA RALINK
      # ============================================================
      - name: Revisar estructura Ralink
        shell: bash
        run: |
          set -e

          cd kernel

          echo "========================================"
          echo "       ESTRUCTURA RALINK"
          echo "========================================"

          find drivers/net/wireless/ralink \
            -maxdepth 2 \
            -type f \
            | sort


      # ============================================================
      # 7. REVISAR DEFINICIONES RT2X00
      # ============================================================
      - name: Revisar definiciones RT2X00
        shell: bash
        run: |
          set -e

          cd kernel

          echo "========================================"
          echo "       DEFINICIONES RT2X00"
          echo "========================================"

          echo ""
          echo "===== RT2X00 ====="

          grep -n -A20 -B5 \
            'config RT2X00' \
            drivers/net/wireless/ralink/rt2x00/Kconfig || true

          echo ""
          echo "===== RT2800USB ====="

          grep -n -A20 -B5 \
            'config RT2800USB' \
            drivers/net/wireless/ralink/rt2x00/Kconfig || true

          echo ""
          echo "===== RT2800USB_RT53XX ====="

          grep -n -A15 -B5 \
            'config RT2800USB_RT53XX' \
            drivers/net/wireless/ralink/rt2x00/Kconfig || true


      # ============================================================
      # 8. GENERAR .CONFIG
      # ============================================================
      - name: Generar configuracion A03s
        shell: bash
        run: |
          set -e

          cd kernel

          echo "========================================"
          echo "       GENERANDO .config"
          echo "========================================"

          make \
            ARCH=arm64 \
            CC=clang \
            HOSTCC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            a03s_defconfig

          echo ""
          echo "===== .CONFIG ====="

          if [ -f .config ]; then
            echo ".config: OK"
            ls -lh .config
          else
            echo ".config: NO GENERADO"
            exit 1
          fi


      # ============================================================
      # 9. COMPARAR DEFCONFIG Y .CONFIG
      # ============================================================
      - name: Comparar configuraciones RT5370
        shell: bash
        run: |
          set -e

          cd kernel

          echo "========================================"
          echo "       COMPARACION FINAL"
          echo "========================================"

          echo ""
          echo "===== DEFCONFIG ====="

          grep -nE \
            'CONFIG_(RT2X00|RT2800USB|RT2800USB_RT53XX|RT2X00_LIB_USB)' \
            arch/arm64/configs/a03s_defconfig || true

          echo ""
          echo "===== .CONFIG ====="

          grep -nE \
            'CONFIG_(RT2X00|RT2800USB|RT2800USB_RT53XX|RT2X00_LIB_USB)' \
            .config || true

          echo ""
          echo "===== WLAN ====="

          grep -nE \
            '^CONFIG_(WIRELESS|WLAN|CFG80211|MAC80211)=' \
            .config || true

          echo ""
          echo "===== USB ====="

          grep -nE \
            '^CONFIG_(USB_SUPPORT|USB|HAS_DMA)=' \
            .config || true


      # ============================================================
      # 10. BUSCAR POSIBLES CONDICIONES
      # ============================================================
      - name: Buscar condiciones RT2X00
        shell: bash
        run: |
          set -e

          cd kernel

          echo "========================================"
          echo "       CONDICIONES RT2X00"
          echo "========================================"

          echo ""
          echo "===== DEPENDENCIAS ====="

          grep -n \
            -E 'depends on|select ' \
            drivers/net/wireless/ralink/rt2x00/Kconfig \
            | head -80

          echo ""
          echo "===== SYMBOL RT2800USB ====="

          grep -Rns \
            'RT2800USB' \
            drivers/net/wireless/ralink/rt2x00 \
            2>/dev/null || true


      # ============================================================
      # 11. GUARDAR DIAGNOSTICO
      # ============================================================
      - name: Guardar diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a03s-diagnostico-inclusion-rt5370
          path: |
            kernel/.config
            kernel/arch/arm64/configs/a03s_defconfig
            kernel/drivers/net/wireless/Kconfig
            kernel/drivers/net/wireless/ralink/Kconfig
            kernel/drivers/net/wireless/ralink/rt2x00/Kconfig
            kernel/drivers/net/wireless/ralink/rt2x00/Makefile
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

Qué necesito de esta ejecución

Cuando termine, no necesitas copiar todo el log. Pásame solamente estos tres bloques:

===== INCLUDE RT2X00 =====

===== INCLUDE RALINK =====

y:

===== drivers/net/wireless/ralink/Kconfig =====

Si "ralink/Kconfig" dice "NO EXISTE", pásame eso también.

Con esos datos podremos saber si el problema está en la cadena de "source" de Kconfig. Después de eso sí podremos hacer la modificación concreta y pasar a comprobar que aparezca:

CONFIG_RT2X00=m
CONFIG_RT2800USB=m
CONFIG_RT2800USB_RT53XX=y

en ".config", antes de intentar cualquier compilación.
