name: Build Kernel
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/diego20362/android_kernel_samsung_a03s-nethunter.git
          kernel-branch: android-4.19-stable
          config: defconfig
          arch: arm64
