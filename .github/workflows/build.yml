name: A03s NetHunter - Verificacion RT5370

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verificar soporte RT5370
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar codigo del kernel
        uses: actions/checkout@v4
        with:
          ref: android-4.19-stable
          fetch-depth: 1
          submodules: false

      - name: Instalar herramientas Kconfig
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            bc \
            bison \
            flex \
            build-essential \
            libssl-dev \
            libelf-dev

      - name: Verificar RT5370
        shell: bash
        run: |
          echo "========================================"
          echo "       VERIFICACION RT5370 A03S"
          echo "========================================"

          echo ""
          echo "1. ARCHIVOS DEL DRIVER"
          echo "----------------------------------------"

          if [ -d "drivers/net/wireless/ralink/rt2x00" ]; then
            echo "RT2X00: OK"
          else
            echo "RT2X00: NO ENCONTRADO"
          fi

          if [ -f "drivers/net/wireless/ralink/rt2x00/rt2800usb.c" ]; then
            echo "RT2800USB: OK"
          else
            echo "RT2800USB: NO ENCONTRADO"
          fi

          echo ""
          echo "2. SOPORTE RT5370 EN KCONFIG"
          echo "----------------------------------------"

          if grep -q 'config RT2800USB_RT53XX' \
            drivers/net/wireless/ralink/rt2x00/Kconfig; then
            echo "RT5370: SOPORTADO"
          else
            echo "RT5370: NO ENCONTRADO"
          fi

          if grep -q 'select RT2X00_LIB_USB' \
            drivers/net/wireless/ralink/rt2x00/Kconfig; then
            echo "RT2X00_LIB_USB: DISPONIBLE"
          else
            echo "RT2X00_LIB_USB: NO ENCONTRADO"
          fi

          echo ""
          echo "3. CONFIGURACION A03S"
          echo "----------------------------------------"

          grep -nE \
            'CONFIG_(USB|CFG80211|MAC80211|RT2X00|RT2800USB)' \
            arch/arm64/configs/a03s_defconfig || true

          echo ""
          echo "4. MAKEFILE DEL DRIVER"
          echo "----------------------------------------"

          if [ -f "drivers/net/wireless/ralink/rt2x00/Makefile" ]; then
            echo "Makefile RT2X00: OK"
            grep -nE 'rt2800usb|rt2x00' \
              drivers/net/wireless/ralink/rt2x00/Makefile || true
          else
            echo "Makefile RT2X00: NO ENCONTRADO"
          fi

          echo ""
          echo "5. RESULTADO FINAL"
          echo "----------------------------------------"

          DRIVER_OK=1

          [ -d "drivers/net/wireless/ralink/rt2x00" ] || DRIVER_OK=0
          [ -f "drivers/net/wireless/ralink/rt2x00/rt2800usb.c" ] || DRIVER_OK=0
          grep -q 'config RT2800USB_RT53XX' \
            drivers/net/wireless/ralink/rt2x00/Kconfig || DRIVER_OK=0
          grep -q 'select RT2X00_LIB_USB' \
            drivers/net/wireless/ralink/rt2x00/Kconfig || DRIVER_OK=0

          if [ "$DRIVER_OK" -eq 1 ]; then
            echo "RT5370: OK"
          else
            echo "RT5370: REVISAR"
          fi

          echo "========================================"

      - name: Guardar diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a03s-rt5370-diagnostico
          path: |
            arch/arm64/configs/a03s_defconfig
            drivers/net/wireless/ralink/rt2x00/Kconfig
            drivers/net/wireless/ralink/rt2x00/Makefile
          if-no-files-found: warn
          retention-days: 7
