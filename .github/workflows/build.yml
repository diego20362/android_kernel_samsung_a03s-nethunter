name: A03s NetHunter - Diagnostico

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Inspeccionar kernel A03s
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar codigo del kernel
        uses: actions/checkout@v4
        with:
          ref: android-4.19-stable
          fetch-depth: 1
          submodules: false

      - name: Instalar herramientas ARM64 y Clang
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            llvm \
            lld \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            bc bison flex \
            libssl-dev libelf-dev \
            build-essential python3

          echo "===== VERIFICAR CLANG ====="
          clang --version

          echo "===== VERIFICAR GCC ARM64 ====="
          aarch64-linux-gnu-gcc --version

          echo "===== VERIFICAR LINKER ARM64 ====="
          aarch64-linux-gnu-ld --version

          echo "===== VERIFICAR LLD ====="
          ld.lld --version

      - name: Comprobar configuracion A03s
        shell: bash
        run: |
          echo "===== GENERAR CONFIGURACION ====="
          make ARCH=arm64 CC=clang HOSTCC=clang CROSS_COMPILE=aarch64-linux-gnu- a03s_defconfig

          echo "===== VERIFICAR RT5370 ====="
          grep -E 'CONFIG_(CFG80211|MAC80211|RT2X00|RT2800USB|RT2800USB_RT53XX)=' .config || true

      - name: Revisar herramientas del compilador
        shell: bash
        run: |
          echo "===== CLANG DISPONIBLE ====="
          clang --version || true

          echo "===== GCC AARCH64 DISPONIBLE ====="
          aarch64-linux-gnu-gcc --version || true

          echo "===== BINUTILS AARCH64 ====="
          aarch64-linux-gnu-ld --version || true

          echo "===== RUTA CLANG DEL MAKEFILE ====="
          ls -l toolchain/clang/host/linux-x86/clang-r383902/bin/ 2>/dev/null || true

      - name: Revisar kernel y defconfig
        shell: bash
        run: |
          echo "===== VERSION KERNEL ====="
          head -n 10 Makefile

          echo "===== DEFCONFIG A03S ====="
          ls arch/arm64/configs/*a03s* 2>/dev/null || true

          echo "===== OPCIONES WIFI ====="
          grep -nE 'CONFIG_CFG80211|CONFIG_MAC80211|CONFIG_USB=|CONFIG_RT2X00|CONFIG_RT2800' \
            arch/arm64/configs/a03s_defconfig || true

      - name: Buscar controlador RT5370
        shell: bash
        run: |
          echo "===== ARCHIVOS RT2X00 ====="
          find drivers -iname '*rt2x00*' -o -iname '*rt2800*' -o -iname '*5370*'

          echo "===== OPCIONES KCONFIG ====="
          grep -nE 'config (RT2X00|RT2800USB|RT2800USB_RT53XX|RT2X00_LIB_USB)' \
            drivers/net/wireless/ralink/rt2x00/Kconfig || true

          echo "===== DEPENDENCIAS ====="
          sed -n '130,195p' drivers/net/wireless/ralink/rt2x00/Kconfig

          echo "===== MAKEFILE RALINK ====="
          cat drivers/net/wireless/ralink/rt2x00/Makefile

      - name: Guardar archivos de diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a03s-diagnostico
          path: |
            .config
            Makefile
            arch/arm64/configs/
            drivers/net/wireless/ralink/rt2x00/
          if-no-files-found: warn
          retention-days: 7
